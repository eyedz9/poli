services:
  # ─── PostgreSQL + pgvector ────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: polireports-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polireports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-polireports}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polireports}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polireports

  # ─── pgAdmin (DB management UI) ──────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: polireports-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - polireports

  # ─── Redis (BullMQ job queues) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: polireports-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # noeviction: BullMQ is a job queue, not a cache — evicting keys would
    # silently drop jobs. maxmemory raised to give the queue headroom.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - polireports

  # ─── API (Hono/Node.js) ───────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: polireports-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-polireports}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polireports}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
    networks:
      - polireports

  # ─── Worker (BullMQ) ─────────────────────────────────────────────────
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: polireports-worker
    restart: unless-stopped
    command: node dist/worker.js
    env_file: .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-polireports}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-polireports}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - polireports

  # ─── Dashboard (React/Vite) ───────────────────────────────────────────
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      target: dev
    container_name: polireports-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      # In-network hostname — the Vite dev server proxies /api here from inside
      # the dashboard container, so it must be 'api', not 'localhost'.
      - VITE_API_URL=http://api:3000
    depends_on:
      - api
    networks:
      - polireports

  # ─── n8n (orchestration) ─────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: polireports-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:?N8N_PASSWORD must be set}
      - DB_TYPE=sqlite
      - N8N_USER_FOLDER=/home/node/.n8n
      - GENERIC_TIMEZONE=America/New_York
      - NODE_FUNCTION_ALLOW_EXTERNAL=axios,node-fetch
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n/workflows:/home/node/.n8n/workflows:ro
    networks:
      - polireports

  # ─── Redis UI (dev profile only) ─────────────────────────────────────
  redis-ui:
    image: redis/redisinsight:latest
    container_name: polireports-redis-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    profiles:
      - dev
    networks:
      - polireports

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  n8n_data:

networks:
  polireports:
    driver: bridge
